# ============================================================
# QiaoMES · 生产部署编排（镜像仓模式，服务器不构建）
#
# 用法（服务器上）：
#   cd /root/qiaomes
#   docker compose -f docker-compose.deploy.yml pull && docker compose -f docker-compose.deploy.yml up -d
#
# 设计要点：
#   1. 只用 image: 拉镜像，**服务器不需要 .NET SDK / Node**，也不吃 CPU 内存去构建
#      （本机是 1GB 轻量机，在服务器上 docker build 会 OOM）。
#   2. 全部可变项都走 `.env`（同目录）。**必须先把 .env 写好再 up**，
#      否则 WEB_PORT / POSTGRES_PASSWORD 会退回默认值——前者会让端口从 8090 变回 8080，
#      后者会让 API 连不上已初始化的数据库卷。CI 部署脚本会先写 .env 再重建。
#   3. `gateway` 是看板站的 Caddy 网关网络（external）。caddy 通过 `qiaomes-web:80`
#      反代 mes.qiaoqiaoqiao.me，**web 必须挂在这个网络上**，否则域名会 502/无法解析。
#      注意：手工 `docker network connect` 不是持久的，容器一重建就丢，所以这里声明成 external。
#
# .env 可用变量：
#   QIAOMES_API_IMAGE / QIAOMES_WEB_IMAGE   完整镜像地址（含 registry 与 tag）
#   JWT_SECRET_KEY / POSTGRES_PASSWORD      ⚠️ POSTGRES_PASSWORD 必须与数据库卷初始化时一致
#   WEB_PORT（对外端口，默认 8080；本机与服务共存故用 8090）
#   CORS_ORIGINS / GATEWAY_NETWORK
#   DEMO_DATA_ENABLED / ASSISTANT_ENABLED / ASSISTANT_LLM_* / ASSISTANT_DB_CONNECTION
#   ITERATION_BASE_URL / ITERATION_ADMIN_KEY  （留空 = 改进建议功能关闭，见 docs/ITERATION.md）
#
# 完整可复制模板见仓库根目录 `.env.example`。
#
# 自动部署见 `.github/workflows/deploy.yml` + `deploy/gh_deploy_aliyun.py`，说明见 `docs/CICD.md`。
# ============================================================

services:
  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: qiaomes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qiaomes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qiaomes_dev}
      POSTGRES_DB: qiaomes
      TZ: Asia/Shanghai
    ports:
      # 🔴 默认只绑回环（服务器上就该这样）：这台机器有公网 IP，绑 0.0.0.0
      # 等于把数据库暴露在公网扫描面上。容器之间走 qiaomes-net 用服务名 postgres 连接，不受影响；
      # 需要在服务器上直连时用 `docker exec -it qiaomes-postgres psql -U qiaomes -d qiaomes`。
      #
      # ⚠️ 为什么做成变量：**Docker Desktop（Windows/macOS）只代理 0.0.0.0 的端口映射** ——
      # 绑 127.0.0.1 时那个端口只存在于 WSL 虚拟机内部，Windows 宿主连不上
      # （实测：本机 `dotnet run` 会报 `Failed to connect to 127.0.0.1:5432`）。
      # 所以本机跑这份编排时，由 tools/start-local.ps1 在 .env 里写 POSTGRES_BIND=0.0.0.0 ——
      # 那台机器是你的开发机、不是公网服务器，可以接受。
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      # ⚠️ 卷名不可改：改成别的名字会挂到一个空库上，看起来像"数据全丢了"
      - qiaomes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiaomes -d qiaomes"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 小内存服务器（1GB 轻量机）调优：限制共享缓冲与连接数，避免把内存吃满
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=50
      -c effective_cache_size=256MB
      -c work_mem=4MB
    networks:
      - qiaomes-net

  # ---------- 后端 API ----------
  api:
    image: ${QIAOMES_API_IMAGE:-ccr.ccs.tencentyun.com/qiaoqiao11/qiaomes-api:latest}
    container_name: qiaomes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 全部模块共用同一连接，才能把跨模块写入放进同一个事务
      ConnectionStrings__DefaultDb: Host=postgres;Port=5432;Database=qiaomes;Username=qiaomes;Password=${POSTGRES_PASSWORD:-qiaomes_dev}
      # 🔴 必填（`:?` 表示未设置就让 compose 直接拒绝启动，并打印等号后面那句人话）。
      # 此前这里是 `${JWT_SECRET_KEY:-内置默认值}` —— 意味着漏配 Secret 时**生产会静默使用一个公开的密钥**，
      # 任何人都能用它伪造令牌，而且从日志里完全看不出来。宁可部署失败（旧容器继续跑），也不要这种"成功"。
      # 本地 `docker-compose.yml` 仍保留兜底值，那是为了让 `docker compose up -d --build` 开箱即用。
      Jwt__SecretKey: ${JWT_SECRET_KEY:?未设置 JWT_SECRET_KEY：请在服务器 .env 或仓库 Secrets 里配置一个不少于 32 字符的随机串（模板见 .env.example）}
      Jwt__Issuer: QiaoMES
      Jwt__Audience: QiaoMES.Api
      # 前端对外访问地址（同源部署其实用不到，但直连 API 调试/脚本会用到）
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:8080}
      # 演示数据端点（默认关闭；想要一套演示数据时设为 true 再用 tools/seed-demo.ps1）
      DemoData__Enabled: ${DEMO_DATA_ENABLED:-false}
      # 智能问数：任何 OpenAI 兼容端点都行（DeepSeek / 通义 / Kimi / 本地 Ollama）
      Assistant__Enabled: ${ASSISTANT_ENABLED:-true}
      Assistant__Llm__BaseUrl: ${ASSISTANT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      Assistant__Llm__ApiKey: ${ASSISTANT_LLM_API_KEY:-}
      Assistant__Llm__Model: ${ASSISTANT_LLM_MODEL:-deepseek-chat}
      # 生产环境强烈建议指向只读账号；留空则复用 DefaultDb（靠 READ ONLY 事务兜底）
      Assistant__ConnectionString: ${ASSISTANT_DB_CONNECTION:-}
      # 改进建议 / 迭代审阅：指向 AI 迭代服务（同行容器网络，如 http://ai-iteration:8080）。
      # 留空则该功能显示「迭代服务还没配置」的明确提示，不会报错 —— 功能默认关闭是有意的。
      Iteration__BaseUrl: ${ITERATION_BASE_URL:-}
      Iteration__AdminKey: ${ITERATION_ADMIN_KEY:-}
    volumes:
      # 「迭代服务配置」页保存的文件落在这里（容器内 /app/config）。
      # ⚠️ 必须挂宿主目录：写容器可写层的话，每次 up -d --force-recreate 都会被丢掉。
      # ⚠️ 宿主目录要能被容器用户（UID 1654）写 —— 部署脚本会创建并 chown，
      #    手工部署时：mkdir -p /root/qiaomes/config && chown 1654:1654 /root/qiaomes/config
      - ./config:/app/config
    # 不占用宿主机端口：部署脚本用 `docker inspect` 拿到容器 IP 后直接探 8080（见 deploy/gh_deploy_aliyun.py）
    expose:
      - "8080"
    networks:
      - qiaomes-net

  # ---------- 前端（Nginx 托管静态文件 + 反代 API）----------
  web:
    image: ${QIAOMES_WEB_IMAGE:-ccr.ccs.tencentyun.com/qiaoqiao11/qiaomes-web:latest}
    container_name: qiaomes-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    # nginx:alpine 自带 busybox wget（没有 curl），所以用 wget 探活。
    # 这条 healthcheck 专门盯一类踩过的坑：镜像里的 nginx entrypoint 脚本卡住时，
    # 容器是 Up 的、端口却无人应答 —— 只看 docker ps 会以为「部署成功」。
    # （aspnet 运行时镜像里 curl/wget 都没有，所以 api 侧只能从宿主机探容器 IP，见 deploy/gh_deploy_aliyun.py）
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - qiaomes-net
      # 与看板站网关（kanban-caddy）同网，便于用域名 + HTTPS 反向代理到本服务；
      # 该网络由看板站 compose 创建，故声明为 external。
      - gateway

  # ---------- AI 自迭代服务（只跑规划侧：提建议 / AI 评审 / 迭代计划 / 周期冻结结算）----------
  # 它原先是一个**独立的 compose 项目**（/root/ai-iteration/docker-compose.yml）。现在收编到这里：
  # 一次部署就把「改进建议」这条链一起带起来，服务器上不再需要单独维护第二个项目。
  # 部署脚本会把旧栈停掉、把 SQLite 数据搬进来（见 deploy/gh_deploy_aliyun.py 第 5 步）。
  #
  # 🔴 只跑规划侧，**不跑执行**：执行（真改代码 / 跑测试 / 合并）要吃 .NET SDK + Node + git + 源码卷，
  #    这台 1GB 机器扛不住 —— 所以 Scheduler__ExecutorEnabled=false，任务留给开发机上的
  #    AiIteration.Worker 通过 POST /api/tasks/lease 租用执行（见 AI迭代 仓 src/AiIteration.Worker）。
  # ⚠️ 配置键是 `Scheduler:ExecutorEnabled`，**不是** `Iteration:ExecutorEnabled` ——
  #    AI迭代 的代码注释写的是后者，用后者不生效、会静默继续在这台机器上跑构建。
  ai-iteration:
    image: ${AI_ITERATION_IMAGE:-ccr.ccs.tencentyun.com/qiaoqiao11/ai-iteration:latest}
    container_name: ai-iteration
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # 必须与上面 api 的 Iteration__AdminKey 同值 —— 两边都取自同一个 .env 变量，天然一致。
      # 留空时它拒绝一切管理员操作（503）：页面会显示 401/403，而不是悄悄不鉴权。
      Admin__ApiKey: ${ITERATION_ADMIN_KEY:-}
      Llm__BaseUrl: ${ITERATION_LLM_BASE_URL:-https://api.deepseek.com/v1}
      Llm__ApiKey: ${ITERATION_LLM_API_KEY:-}
      Llm__Model: ${ITERATION_LLM_MODEL:-deepseek-flash}
      Data__Directory: /data
      Scheduler__Enabled: "true"
      Scheduler__ExecutorEnabled: "false"
      # 自动合并的目标分支 = **开发环境分支 dev**，不是 main。
      # 分支-环境对照见 docs/BRANCHING.md：AI 改完只进开发环境（:8092），
      # 需求方确认后人工把 dev 同步到 main 才动生产。
      # （AI迭代 代码里还有一道闸门：目标分支是 main/master 时直接抛错，配错也推不上去。）
      Scheduler__AutoMergeEnabled: "true"
      Scheduler__MergeTargetBranch: ${ITERATION_MERGE_TARGET:-dev}
      Scheduler__TimeZoneId: ${ITERATION_TZ:-China Standard Time}
      GIT_ASKPASS: /data/git-askpass.sh
    volumes:
      # SQLite 库（aiiteration.db，含 -wal/-shm）与 git-askpass.sh 都在这里，**必须持久化**。
      - ${AI_ITERATION_DATA_DIR:-./ai-iteration/data}:/data
      # 下面两个只有「在本机执行」时才用得到；保留挂载只是为了万一以后真在这台机器上开执行（不建议）
      - ${AI_ITERATION_WORKSPACES_DIR:-./ai-iteration/workspaces}:/workspaces
      - ${AI_ITERATION_NUGET_DIR:-./ai-iteration/nuget}:/root/.nuget
    # 这个镜像基于 sdk（里面装了 curl），所以能在容器内直接探活；/health/ready 会查一次数据库，
    # 因此它同时是「SQLite 已就绪」的探针（库没迁好 / 没挂上会在这里露出来）。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      # 🔴 保留对外映射，是为了让开发机上的 Worker 能租任务（SSH 被公司网络阻断，只能走公网）。
      # 代价必须说清：这个服务的接口里有几个是**不带鉴权**的（POST /api/tasks、POST /api/workspaces），
      # 暴露在公网等于任何人都能建任务/注册工作区。不想暴露就改成
      # "127.0.0.1:${AI_ITERATION_PORT:-8091}:8080"（本机自用没问题），但那样 Worker 也连不上，
      # 需要另给 Worker 通路（例如经网关反代 + 只放行特定路径）。
      - "${AI_ITERATION_PORT:-8091}:8080"
    networks:
      - qiaomes-net

volumes:
  qiaomes_pgdata:

networks:
  qiaomes-net:
    driver: bridge

  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-kanban_net}
