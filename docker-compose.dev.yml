# ============================================================
# QiaoMES · **开发环境**编排（分支 `dev` 专用）—— 跑在**你的开发机**上
#
# 分支 = 环境：`dev` → 这套（本机 :8092）；`main` → 生产 docker-compose.deploy.yml（服务器 :8090）。
# 起停就一条命令：`pwsh tools/start-dev.ps1`（它会就位 .env.dev、拉 :dev 镜像、做健康检查）。
# 完整流程（AI 推 dev → CI 测+构建 → 本机起 → 需求方看 → 人工合 main）见 docs/BRANCHING.md。
#
# 🔴 为什么放开发机而不是服务器：那台机器只有 2 vCPU / 896MB，再叠一套栈会把**磁盘 I/O** 拖死、
#    连生产一起不可达（2026-09-23 实际发生过一次：load 冲到 38，而没有任何进程在吃 CPU，
#    即"高负载 + 无人占 CPU"= 等 I/O，不是 OOM）。本机内存磁盘都富余，开发环境就该在这儿。
#
# 与生产编排刻意分家的四件事（每条都有理由，别图省事合并）：
#   1. **项目名与容器名独立**：compose 项目名 qiaomes-dev、容器 qiaomes-dev-*。
#      docker 里容器名全局唯一 —— 而且本机很可能同时跑着生产镜像那一套（tools/start-local.ps1）。
#   2. **独立数据库 + 独立网络**：卷 qiaomes_dev_pgdata、网 qiaomes-dev-net。
#      开发环境跑的是 AI 改完、还没人看过的代码 —— 不该连到任何"真实"数据。
#   3. **独立 JWT 密钥与库密码**：由 tools/start-dev.ps1 在本机生成（写进 `.env.dev`）。
#      共用的话，开发环境签发的令牌在生产上是**有效**的，等于把生产的登录口开了一半。
#   4. **不接自迭代服务**：刻意不接（页面会提示未配置，并说明原因）。
#      理由同第 2 条：接上去就能在开发站点上批准/否决**真实**的迭代计划。
#
# mem_limit 保留着：本机虽然宽松，但限量能让"某个容器失控"只影响它自己。
# 不用了就停：`docker compose -p qiaomes-dev stop`（数据卷保留）；
# 想清空开发库重来：`docker compose -p qiaomes-dev down -v`
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: qiaomes-dev-postgres
    restart: unless-stopped
    mem_limit: 200m
    environment:
      POSTGRES_USER: qiaomes
      # 首次部署时由 deploy/gh_deploy_dev.py 生成并写进 /root/qiaomes-dev/.env；
      # ⚠️ 卷初始化之后再改它 = API 连不上库（和生产同一条铁律）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?开发库密码由部署脚本生成写入 /root/qiaomes-dev/.env}
      POSTGRES_DB: qiaomes
      TZ: Asia/Shanghai
    volumes:
      - qiaomes_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiaomes -d qiaomes"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 比生产更抠：开发环境最多一两个人看，不需要大缓冲池
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
      -c effective_cache_size=128MB
      -c work_mem=2MB
    networks:
      - qiaomes-dev-net

  api:
    image: ${QIAOMES_API_IMAGE:-ccr.ccs.tencentyun.com/qiaoqiao11/qiaomes-api:dev}
    container_name: qiaomes-dev-api
    restart: unless-stopped
    mem_limit: 340m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 用 Production 而不是 Development：让需求方在开发环境看到的行为与生产一致
      # （Development 会打开详细异常页、可能触发只该在本地出现的分支）。
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultDb: Host=postgres;Port=5432;Database=qiaomes;Username=qiaomes;Password=${POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?开发环境的 JWT 密钥由部署脚本生成（刻意不与生产共用）}
      Jwt__Issuer: QiaoMES
      Jwt__Audience: QiaoMES.Api
      Cors__Origins: ${CORS_ORIGINS:-http://139.196.195.44:8092}
      # 开发环境默认开演示数据端点，方便需求方看到有内容的界面
      DemoData__Enabled: ${DEMO_DATA_ENABLED:-true}
      Iteration__BaseUrl: ${ITERATION_BASE_URL:-}
      Iteration__AdminKey: ${ITERATION_ADMIN_KEY:-}
      # 开发环境**刻意不接**自迭代服务（见文件头第 4 条），所以给它一句自己的说明：
      # 否则页面那句统一的「请在配置里填上地址」会被当成故障、或被照着填 —— 而填了就会连到
      # **真实的**建议与计划数据，在开发站点上点一下「批准」就真的动到自迭代流程了。
      Iteration__UnconfiguredHint: "（注：本环境是开发环境，刻意不接自迭代服务 —— 它跑的是 AI 改完、还没人看过的代码，接上去可能在开发站点上批准/否决真实的迭代计划。要看改进建议与迭代计划，请用生产站点。）"
    expose:
      - "8080"
    networks:
      - qiaomes-dev-net

  web:
    image: ${QIAOMES_WEB_IMAGE:-ccr.ccs.tencentyun.com/qiaoqiao11/qiaomes-web:dev}
    container_name: qiaomes-dev-web
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - api
    ports:
      - "${DEV_WEB_PORT:-8092}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - qiaomes-dev-net

volumes:
  qiaomes_dev_pgdata:

networks:
  qiaomes-dev-net:
    driver: bridge
