name: Deploy (dev 候选版本)

# ============================================================
# 分支 = 环境：
#   push `dev`  → 本工作流：测试 → 构建并推送 `:dev` 镜像（**只到这里**）
#   push `main` → Deploy 工作流：同样的链路 → 部署**生产**
#
# 🔴 为什么 dev **不再自动部署**：开发环境跑在**开发机**上（服务器只跑生产）。
#    GitHub Runner 在云上，到不了你的机器，所以"部署开发环境"这个动作只能由你本机的一条命令完成：
#        pwsh tools\start-dev.ps1
#    完整链路：AI 推 dev → 这里跑全量测试 + 构建 :dev 镜像 → 你在本机执行上面那行 → 需求方在
#    http://localhost:8092 看效果 → 确认后人工把 dev 合到 main → 生产更新。
#
# 之前把开发环境放在服务器上（:8092）时，它和 QiaoMES 抢同一台 2vCPU/896MB 机器，
# 叠加镜像拉取与清理会把磁盘 I/O 拖死、生产一起不可达 —— 那次事故的结论就是"这台机器给不了第二套环境"。
#
# 说明见 docs/BRANCHING.md。
# ============================================================

on:
  push:
    branches: [dev]
    # 故意不做 paths-ignore（生产那份有）：开发环境这条链路只是测试 + 构建镜像，便宜；
    # 而且新建分支时路径过滤会把差异算成"整棵树全新增"，容易让人误判成"流水线没跑"。
  workflow_dispatch:

# 候选版本可以被打断（生产是 cancel-in-progress: false，绝不允许掐断进行中的发布）
concurrency:
  group: qiaomes-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY || 'ccr.ccs.tencentyun.com' }}
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE || 'qiaoqiao11' }}

jobs:
  # ---------- 1. 测试（与生产共用同一套检查：ci.yml）----------
  test:
    name: 测试
    uses: ./.github/workflows/ci.yml

  # ---------- 2. 构建并推送 :dev 镜像 ----------
  publish:
    name: 构建并推送 :dev 镜像
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 检查必需的 Secrets
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          missing=""
          [ -n "$REGISTRY_USERNAME" ] || missing="$missing REGISTRY_USERNAME"
          [ -n "$REGISTRY_PASSWORD" ] || missing="$missing REGISTRY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets：$missing —— 配置见 docs/CICD.md 第 2.1 / 2.2 节"
            exit 1
          fi

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # :dev 是开发环境的常驻标签（本机 .env.dev 指向它）；git SHA 标签留着排错/回滚
      - name: 构建并推送 API 镜像（:dev）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/QiaoMES.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/qiaomes-api:dev
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/qiaomes-api:${{ github.sha }}
          cache-from: type=gha,scope=qiaomes-api
          cache-to: type=gha,mode=max,scope=qiaomes-api

      - name: 构建并推送 Web 镜像（:dev）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/qiaomes-web:dev
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/qiaomes-web:${{ github.sha }}
          cache-from: type=gha,scope=qiaomes-web
          cache-to: type=gha,mode=max,scope=qiaomes-web

      - name: 告诉你怎么把这一版跑起来（开发环境在你自己机器上）
        run: |
          {
            echo "### ✅ 本次提交的 :dev 镜像已推送"
            echo ""
            echo "开发环境跑在**开发机**上（服务器只跑生产），GitHub Runner 到不了你的机器，所以这里不做部署。"
            echo ""
            echo "在你机器上执行一行，就能把开发环境更新到这一版："
            echo ""
            echo '```powershell'
            echo 'pwsh tools\start-dev.ps1'
            echo '```'
            echo ""
            echo "跑完打开 http://localhost:8092 。"
          } >> "$GITHUB_STEP_SUMMARY"
