server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源（history 路由回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 🔴 index.html **必须每次回源校验**：它引用的 /assets/index-<hash>.js 在下次构建后就换名字了，
    # 浏览器若用缓存的旧 index.html，就会去请求一个已不存在的 js（404）→ **整页白屏**。
    # 2026-09-22 本机重建镜像后实际踩到：旧 index.html 引用 index-CZv3G3Rg.js（404），
    # 而镜像里真正存在的是 index-DTOYVris.js。SPA 的入口 HTML 一律不能进缓存。
    # ⚠️ nginx 的 add_header 只要写在 location 里就会**覆盖**外层同名头 —— 以后加安全响应头时注意。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 健康检查透传：让宿主机 / 外层网关 / 外部监控能直接探 API 的就绪状态
    # （本机一键启动脚本、GitHub Runner 的公网冒烟都靠它；⚠️ 需要重建 web 镜像后才生效，
    #   在此之前那些脚本会自动退回「打一个必然 401 的鉴权接口」来判断 API 是否活着）
    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket 反向代理
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # 带内容哈希的构建产物（Vite 输出到 /assets/，文件名自带 hash）：可以放心长缓存。
    # ^~ 必须加：否则下面那条正则 location 会优先于它匹配，这里就永远不生效。
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其余静态文件（favicon、public 目录原样拷来的图，**文件名没有哈希**）：只短缓存 + 必须回源校验。
    # 给这类文件加 immutable 是和白屏同一类的坑 —— 换了 favicon 30 天内不生效，且无法让已缓存的浏览器更新。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
