services:
  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: qiaomes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qiaomes
      POSTGRES_PASSWORD: qiaomes_dev
      POSTGRES_DB: qiaomes
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - qiaomes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiaomes -d qiaomes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qiaomes-net

  # ---------- 后端 API ----------
  api:
    build:
      context: .
      dockerfile: src/QiaoMES.Api/Dockerfile
    container_name: qiaomes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 数据库连接（服务名 postgres 代替 localhost）
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=qiaomes;Username=qiaomes;Password=qiaomes_dev
      ConnectionStrings__ProductionDb: Host=postgres;Port=5432;Database=qiaomes;Username=qiaomes;Password=qiaomes_dev
      # JWT 配置（生产环境请务必修改 SecretKey）
      Jwt__SecretKey: ${JWT_SECRET_KEY:-QiaoMES_Prod_Secret_Change_Me_At_Least_32_Chars_0123456789}
      Jwt__Issuer: QiaoMES
      Jwt__Audience: QiaoMES.Api
      # 前端访问地址（Nginx 服务）
      Cors__Origins: http://localhost:8080
    expose:
      - "8080"
    networks:
      - qiaomes-net

  # ---------- 前端（Nginx 托管静态文件 + 反代 API） ----------
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: qiaomes-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - qiaomes-net

volumes:
  qiaomes_pgdata:

networks:
  qiaomes-net:
    driver: bridge
