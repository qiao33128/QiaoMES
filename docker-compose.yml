# ============================================================
# QiaoMES · 本地开发编排（镜像**在本地构建**，需要 .NET SDK / Node 基础镜像）
#
# 用法：
#   docker compose up -d --build          # 改完代码必须带 --build，否则跑的还是旧镜像
#
# 服务器 / 团队环境请改用部署版（拉镜像，无需 SDK，启动更快）：
#   docker compose -f docker-compose.deploy.yml up -d
# 自动部署见 .github/workflows/deploy.yml 与 docs/CICD.md
# ============================================================

services:
  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: qiaomes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qiaomes
      POSTGRES_PASSWORD: qiaomes_dev
      POSTGRES_DB: qiaomes
      TZ: Asia/Shanghai
    ports:
      # 这份编排只用于**开发机**（本机 `dotnet run` 需要从宿主连 localhost:5432）。
      # 🔴 必须只写端口（= 0.0.0.0），**不能**写 127.0.0.1：Docker Desktop 只代理 0.0.0.0 的映射，
      # 绑 127.0.0.1 时端口只存在于 WSL 虚拟机内部，Windows 宿主连不上（实测 connection refused）。
      # 服务器请用 docker-compose.deploy.yml —— 那份默认绑 127.0.0.1，不对公网开放。
      - "5432:5432"
    volumes:
      - qiaomes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiaomes -d qiaomes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qiaomes-net

  # ---------- 后端 API ----------
  api:
    build:
      context: .
      dockerfile: src/QiaoMES.Api/Dockerfile
    container_name: qiaomes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # 统一数据库连接（服务名 postgres 代替 localhost）
      # 全部模块共用同一连接，才能把跨模块写入放进同一个事务
      ConnectionStrings__DefaultDb: Host=postgres;Port=5432;Database=qiaomes;Username=qiaomes;Password=qiaomes_dev
      # JWT 配置（生产环境请务必修改 SecretKey）
      Jwt__SecretKey: ${JWT_SECRET_KEY:-QiaoMES_Prod_Secret_Change_Me_At_Least_32_Chars_0123456789}
      Jwt__Issuer: QiaoMES
      Jwt__Audience: QiaoMES.Api
      # 前端访问地址（Nginx 服务）
      Cors__Origins: http://localhost:8080
      # 演示数据端点（默认关闭，仅 Development 环境自动放行；演示服务器可显式打开）
      DemoData__Enabled: ${DEMO_DATA_ENABLED:-false}
      # 智能问数：任何 OpenAI 兼容端点都行（DeepSeek / 通义 / Kimi / 本地 Ollama）
      # ApiKey 留空则功能不可用（页面会给出配置提示），DB 不会被访问
      Assistant__Enabled: ${ASSISTANT_ENABLED:-true}
      Assistant__Llm__BaseUrl: ${ASSISTANT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      Assistant__Llm__ApiKey: ${ASSISTANT_LLM_API_KEY:-}
      Assistant__Llm__Model: ${ASSISTANT_LLM_MODEL:-deepseek-chat}
      # 生产环境强烈建议指向只读账号；留空则复用 DefaultDb（靠 READ ONLY 事务兜底）
      Assistant__ConnectionString: ${ASSISTANT_DB_CONNECTION:-}
      # 改进建议 / 迭代审阅：指向 AI 迭代服务。留空则该功能显示「迭代服务还没配置」的明确提示，不会报错。
      # 本机自己跑迭代服务时用 http://host.docker.internal:8xxx（容器里 localhost 指容器自身，不是宿主机）；
      # 两个服务在同一个 compose 网络里则用服务名，如 http://ai-iteration:8080。
      # 与部署版（docker-compose.deploy.yml）保持一致，否则本地开发会配不了这一项。
      Iteration__BaseUrl: ${ITERATION_BASE_URL:-}
      Iteration__AdminKey: ${ITERATION_ADMIN_KEY:-}
    volumes:
      # 「迭代服务配置」页保存的文件落在这里（容器内 /app/config）。
      # 挂宿主目录而不是写容器可写层：不然每次 up -d --force-recreate 都会被丢掉。
      # 🔴 这个目录里有管理员密钥，已在 .gitignore 里排除，别提交。
      - ./config:/app/config
    expose:
      - "8080"
    networks:
      - qiaomes-net

  # ---------- 前端（Nginx 托管静态文件 + 反代 API） ----------
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: qiaomes-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - qiaomes-net

volumes:
  qiaomes_pgdata:

networks:
  qiaomes-net:
    driver: bridge
